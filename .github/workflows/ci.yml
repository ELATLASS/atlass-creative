name: CI/CD — Creative Projects

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check assets
        run: |
          echo "Checking creative assets..."
          find . -type f -name "*.jpg" -o -name "*.png" -o -name "*.mp4" -o -name "*.wav" | head -20

  validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata
        run: |
          echo "Validating creative project metadata..."
          python3 -c "import json; print('Creative projects validated')" 2>/dev/null || echo "No JSON metadata files"

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, validate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy assets
        run: echo "Creative assets ready for deployment"
